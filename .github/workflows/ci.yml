name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Pocket Ledger tests
        working-directory: pocket-ledger
        run: uv run --python 3.15 pytest -q
      - name: Pocket Ledger lint and types
        working-directory: pocket-ledger
        run: |
          uvx ruff@0.17.2 check
          uvx ruff@0.17.2 format --check
          uv run --python 3.15 --with mypy==2.4.0 mypy --strict src
      - name: Chapter tests
        run: |
          cd chapters/31-pytest-basics && uv run --python 3.15 --with pytest pytest -q
          cd ../32-fixtures-and-parametrize && uv run --python 3.15 --with pytest pytest -q
