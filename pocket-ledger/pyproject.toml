[project]
name = "pocket-ledger"
version = "0.1.0"
description = "A small personal expense tracker"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
ledger = "pocket_ledger.cli:main"
ledger-api = "pocket_ledger.api:serve"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
