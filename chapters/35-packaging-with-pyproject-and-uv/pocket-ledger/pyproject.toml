[project]
name = "pocket-ledger"
version = "0.1.0"
description = "A tiny expense ledger"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
ledger = "pocket_ledger.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
